<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melt the World's Biggest Ice Block - Prototype</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Fredoka", system-ui, sans-serif; background: #0f2244; color: #fff; }
  header { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; }
  h1 { margin: 0; font-size: 26px; }
  .bar { width: min(520px, 90vw); height: 26px; background: #0a1730; border: 2px solid #3a64a8; border-radius: 10px; overflow: hidden; position: relative; }
  .bar > div { height: 100%; background: #ff8c32; width: 0; transition: width .2s; }
  .bar span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  main { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; padding: 0 16px 24px; }
  canvas { background: #dff1ff; border: 3px solid #3a64a8; border-radius: 12px; cursor: crosshair; touch-action: none; }
  aside { width: 340px; display: flex; flex-direction: column; gap: 8px; }
  .coins { font-size: 26px; color: #ffd746; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 8px; background: #1e3c6e; border-radius: 10px; padding: 8px 10px; border-left: 8px solid var(--c); }
  .row .t { flex: 1; }
  .row b { display: block; font-size: 15px; }
  .row small { color: #c8e1ff; font-size: 12px; }
  button { font: inherit; font-weight: 700; color: #fff; border: 0; border-radius: 8px; padding: 8px 10px; min-width: 92px; cursor: pointer; background: #50c86e; }
  button.no { background: #a04646; } button.own { background: #4a8ce6; } button.eq, button.lock { background: #64647a; cursor: default; }
  #toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; pointer-events: none; text-shadow: 0 2px 0 #14203c; }
  p.hint { margin: 0; color: #c8e1ff; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Melt the World's Biggest Ice Block</h1>
  <div id="blockName">Block 1</div>
  <div class="bar"><div id="fill"></div><span id="pct">0%</span></div>
</header>
<main>
  <canvas id="c" width="520" height="520" aria-label="Ice block cross-section"></canvas>
  <aside>
    <div class="coins" id="coins">0 coins</div>
    <p class="hint">Hold the mouse over the ice to heat it. Only exposed ice melts, so work from the outside in. Look for frozen treasures!</p>
    <div id="shop"></div>
  </aside>
</main>
<div id="toast"></div>
<script>
// Mirrors src/shared/Config.luau
const heaters = [
  ["Pocket Heater",0,4,1.0,1,"#ffaa3c"],["Hair Dryer",60,10,1.3,2,"#ff78c8"],["Space Heater",350,28,1.6,3,"#ff5a28"],
  ["Blowtorch",1800,80,1.9,4,"#50aaff"],["Industrial Furnace",9000,240,2.3,6,"#ff3c14",1],["Plasma Cannon",50000,800,2.8,9,"#aa50ff",1],["Miniature Sun",300000,3000,3.5,14,"#ffe65a",1]];
const blocks = [["Freezer Cube",5,10,1.6,1,100],["Glacier Chunk",7,40,1.7,4,800],["Permafrost Slab",9,160,1.8,15,6000],["Polar Monolith",11,700,1.9,60,40000],["World's Biggest Ice Block",13,3000,2,250,400000]];
const treasures = [["Frozen Caveman",5,.03,400,"#966446"],["Mammoth Tusk",4,.05,120,"#f0e6d2"],["Ancient Coin Chest",3,.08,40,"#ffcd32"],["Frozen Fish",2,.12,10,"#ff8c3c"]];
const S = { coins: 0, owned: [true], eq: 0, power: 0, bi: 0 };
const powerCost = l => Math.floor(25 * 1.45 ** l);
let cells = [], n = 0, remaining = 0, mouse = null;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const fmt = v => v >= 1e6 ? (v/1e6).toFixed(1)+"M" : v >= 1e3 ? (v/1e3).toFixed(1)+"K" : Math.floor(v)+"";

function build() {
  const [name, size, hp, cold] = blocks[S.bi]; n = size; cells = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const layer = 1 + Math.min(x, y, n-1-x, n-1-y), h = hp * cold ** (layer-1);
    const t = treasures.find(t => layer >= t[1] && Math.random() < t[2]);
    cells.push({ x, y, layer, hp: h, max: h, t, alive: true });
  }
  remaining = cells.length; ui();
}
const at = (x, y) => x < 0 || y < 0 || x >= n || y >= n ? null : cells[y*n+x];
const exposed = c => [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => { const o = at(c.x+dx, c.y+dy); return !o || !o.alive; });

function toast(txt, col) { const el = document.getElementById("toast"); el.textContent = txt; el.style.color = col; clearTimeout(toast.t); toast.t = setTimeout(() => el.textContent = "", 1800); }

function tick(dt) {
  if (!mouse || !remaining) return;
  const h = heaters[S.eq], cs = cv.width / n, heat = h[2] * (1 + S.power * .15);
  const range = h[3] * cs;
  const tg = cells.filter(c => c.alive && exposed(c)).map(c => ({ c, d: Math.hypot((c.x+.5)*cs - mouse.x, (c.y+.5)*cs - mouse.y) }))
    .filter(o => o.d <= range).sort((a, b) => a.d - b.d).slice(0, h[4]);
  const b = blocks[S.bi];
  for (const { c } of tg) {
    c.hp -= heat * dt;
    if (c.hp <= 0) {
      c.alive = false; remaining--; S.coins += b[4] * c.layer;
      if (c.t) { S.coins += b[4] * c.t[3]; toast(`Found a ${c.t[0]}! +${fmt(b[4]*c.t[3])}`, c.t[4]); }
      if (!remaining) { S.coins += b[5]; toast(`Reached the centre of the ${b[0]}! +${fmt(b[5])}`, "#ffdc50"); S.bi = (S.bi+1) % blocks.length; setTimeout(build, 1500); }
      ui();
    }
  }
}

function draw() {
  const cs = cv.width / n; ctx.clearRect(0, 0, cv.width, cv.height);
  for (const c of cells) {
    if (!c.alive) continue;
    const f = c.hp / c.max, d = (c.layer-1) / Math.max((n-1)/2, 1), pad = (1-f) * cs * .2;
    ctx.fillStyle = `rgba(${190-150*d|0},${235-170*d|0},255,${.35+.65*f})`;
    ctx.fillRect(c.x*cs+pad+1, c.y*cs+pad+1, cs-2*pad-2, cs-2*pad-2);
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(c.x*cs+pad+4, c.y*cs+pad+4, (cs-2*pad)*.3, 4);
    if (c.t) { ctx.fillStyle = c.t[4]; ctx.globalAlpha = .5 + .5*(1-f) ; ctx.fillRect(c.x*cs+cs*.32, c.y*cs+cs*.32, cs*.36, cs*.36); ctx.globalAlpha = 1; }
  }
  if (mouse) { const h = heaters[S.eq]; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, h[3]*cs, 0, 7); ctx.fillStyle = h[5] + "33"; ctx.fill(); ctx.strokeStyle = h[5]; ctx.lineWidth = 3; ctx.stroke(); }
}

function ui() {
  const b = blocks[S.bi], p = cells.length ? 1 - remaining / cells.length : 0;
  document.getElementById("blockName").textContent = `Block ${S.bi+1}/${blocks.length}: ${b[0]} (${b[1]}×${b[1]}×${b[1]})`;
  document.getElementById("fill").style.width = p*100 + "%";
  document.getElementById("pct").textContent = Math.floor(p*100) + "% melted";
  document.getElementById("coins").textContent = fmt(S.coins) + " coins";
  const rows = [[`Heating Power Lv ${S.power}`, `+${S.power*15}% heat`, "#ffc83c", powerCost(S.power), S.coins >= powerCost(S.power) ? "" : "no", "power"]];
  heaters.forEach((h, i) => {
    let label = fmt(h[1]), cls = S.coins >= h[1] ? "" : "no";
    if (S.eq === i) { label = "Equipped"; cls = "eq"; } else if (S.owned[i]) { label = "Equip"; cls = "own"; } else if (!S.owned[i-1]) { label = "Locked"; cls = "lock"; }
    rows.push([(h[6] ? "[Industrial] " : "") + h[0], `${h[2]} heat/s · ${h[4]} cubes`, h[5], label, cls, i]);
  });
  document.getElementById("shop").innerHTML = rows.map(r => `<div class="row" style="--c:${r[2]};margin-bottom:8px"><div class="t"><b>${r[0]}</b><small>${r[1]}</small></div><button class="${r[4]}" data-k="${r[5]}">${typeof r[3] === "number" ? fmt(r[3]) : r[3]}</button></div>`).join("");
}
document.getElementById("shop").onclick = e => {
  const k = e.target.dataset?.k; if (k === undefined) return;
  if (k === "power") { const c = powerCost(S.power); if (S.coins >= c) { S.coins -= c; S.power++; } }
  else { const i = +k, h = heaters[i]; if (S.owned[i]) S.eq = i; else if (S.owned[i-1] && S.coins >= h[1]) { S.coins -= h[1]; S.owned[i] = true; S.eq = i; toast(`Unlocked ${h[0]}!`, h[5]); } }
  ui();
};
const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX-r.left) * cv.width/r.width, y: (e.clientY-r.top) * cv.height/r.height }; };
cv.onpointerdown = e => mouse = pos(e); cv.onpointermove = e => { if (mouse) mouse = pos(e); };
addEventListener("pointerup", () => mouse = null);
let last = performance.now();
(function loop(t) { tick(Math.min((t-last)/1000, .1)); last = t; draw(); requestAnimationFrame(loop); })(last);
build();
</script>
</body>
</html>
